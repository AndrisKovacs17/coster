# Install once: uv run pre-commit install
# ruff runs from the project environment, so local hooks and CI use the same version.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout  # notebook outputs can contain Coster data
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10000]  # research PDFs up to 10 MB
      - id: end-of-file-fixer
      - id: trailing-whitespace
