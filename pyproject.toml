[project]
name = "coster"
version = "0.1.0"
description = "Plant virtualisation prototype: fill-ratio forecast per cell class for Coster's automated warehouse"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.24",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Group 2: dashboard
dashboard = ["streamlit>=1.38"]
# Later rungs of the forecast ladder, only once there is enough history
ml = ["scikit-learn>=1.5", "lightgbm>=4.5", "mapie>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "nbstripout>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
